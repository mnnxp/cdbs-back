[package]
name = "cdbs-back"
version = "0.1.0"
authors = ["mnnxp <mananaxep@gmail.com>"]
edition = "2021"
resolver = "1"
rust-version = "1.56.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenv = "0.15"

tokio = "1.21.2"

actix-web = "4.2.1"
actix-cors = "0.6.4"
actix-multipart = "0.4.0"
futures = "0.3.25"

reqwest = { version = "0.11.12", features = ["json"] }

diesel = { version = "2.0.2", features = ["postgres", "uuid", "chrono", "r2d2"] }
r2d2 = "0.8.10"

async-graphql = { version = "5.0.0-alpha.3", default-features = false, features = ["chrono", "uuid"] }
async-graphql-actix-web = "5.0.0-alpha.3"

uuid = { version = "=1.2.2", features = ["serde", "v4"] }
time = "0.3.17"
chrono = { version = "0.4.23", features = ["serde"] }

lazy_static = "1.4.0"
log = "0.4.17"
env_logger ="0.9.3"

serde = "1.0.147"
serde_derive = "1.0.147"
serde_json = "1.0.87"

rand = "0.8.5"
rust-argon2 = "1.0.0"
# jsonwebtoken = "=7.2.0"
jsonwebtoken = "8.1.1"

anyhow = "1.0.66"
thiserror = "1.0.37"
num = "0.4.0"
sanitize-filename = "0.4.0"
# infer = "0.5.0"

structopt = "0.3.26"

regex = "1.7.0"

ring = "0.16.20"
sha2 = "0.10.6"
hmac = "0.12.1"
base64 = "0.13.1"
hex = "0.4.3"

digest = "0.10.5"
blake3 = "1.3.1"
bytes = "1.2.1"

rusoto_core = "0.48.0"
rusoto_s3 = "0.48.0"
rusoto_signature = "0.48.0"

[dev-dependencies]
actix-rt = "2.7.0"
